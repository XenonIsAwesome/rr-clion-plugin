name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --no-configuration-cache
      - name: Build plugin
        run: ./gradlew buildPlugin --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/build/test-results/test/**/TEST-*.xml"
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
          retention-days: 30

  # Downloads the full CLion distribution (~2 GB), so it only runs on the main branch.
  verify:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-configuration-cache
